<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cifra de César · Disco interativo</title>
<style>
:root{color-scheme:light;--green:#005535;--gold:#d6a51e}*{box-sizing:border-box}body{margin:0;background:#f8fbf8;color:var(--green);font-family:Arial,Helvetica,sans-serif;min-height:100svh;overflow-x:hidden}body:before{content:"";position:fixed;inset:0 0 auto;height:11px;background:linear-gradient(100deg,#00492f 0%,#087044 57%,#d2a21e 57%,#ffe69a 100%)}main{width:min(100%,760px);margin:auto;padding:30px 20px 24px;text-align:center}h1{font-size:clamp(25px,4vw,36px);letter-spacing:-1px;margin:0 0 8px}p{font-size:15px;line-height:1.5;margin:0;color:#496a59}.wheel{width:min(100%,65svh,590px);margin:14px auto 12px;filter:drop-shadow(0 12px 20px #003e2514)}svg{width:100%;height:auto;display:block;overflow:visible;user-select:none;-webkit-user-select:none}#rotor{touch-action:none;cursor:grab;outline:none}#rotor:active{cursor:grabbing}#rotor:focus-visible .focus-ring{stroke:#087cc1;stroke-width:5}.controls{display:flex;justify-content:center;gap:12px}button{font:600 14px Arial;border:1px solid #c6d8cb;background:white;color:var(--green);border-radius:14px;padding:12px 18px;min-height:60px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 3px 0 #e4ece5;touch-action:manipulation}button:hover{background:#edf5ed;border-color:#86ae91}button:active{transform:translateY(2px);box-shadow:none}button:focus-visible{outline:3px solid #d6a51e;outline-offset:4px}.arrow{font-size:33px;line-height:1}.note{margin-top:17px;font-size:12px;color:#708478}@media(max-width:420px){main{padding:26px 12px 20px}.controls{gap:8px}button{padding:10px 12px;font-size:12px}.wheel{margin:22px auto}.note{font-size:11px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.author-link{display:block;margin:0 0 12px;text-align:right;color:var(--green);font-size:13px;font-weight:600;text-decoration:none}.author-link:hover{text-decoration:underline}.author-link:focus-visible{outline:3px solid var(--gold);outline-offset:4px}

/* Controles: mantém o visual original e acrescenta o reinício central. */
.controls{align-items:stretch}
#reset-wheel{background:#eff6ef;border-color:#b2d0bd;box-shadow:0 3px 0 #dceadf}
#reset-wheel:hover{background:#e3f0e7;border-color:#86ae91}
.reset-icon{font-size:25px;line-height:1}
/* Os três botões permanecem na mesma linha, mesmo em celulares estreitos. */
@media(max-width:520px){
 .controls{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:7px}
 .controls button{min-width:0;min-height:64px;padding:9px 6px;gap:3px;justify-content:center}
 .controls #ccw,.controls #cw,.controls #reset-wheel{flex-direction:column}
 .controls #cw .arrow{order:-1}
 .controls #reset-wheel{padding:9px 11px}
 .controls .arrow{font-size:27px}
 .controls .reset-icon{font-size:24px}
}
@media(max-width:340px){.controls button{font-size:11px}.controls #reset-wheel{padding-left:7px;padding-right:7px}}
</style>
</head>
<body><main>
<a class="author-link" href="https://www.instagram.com/profferreira7/" target="_blank" rel="noopener noreferrer">Prof. Ferreira Santos · @profferreira7</a>
<h1>Cifra de César</h1>
<p>Arraste o círculo verde ou use as setas para girar.</p>
<div class="wheel">
<svg id="wheel" viewBox="-310 -310 620 620" aria-label="Disco da cifra de César: alfabeto externo fixo e alfabeto interno giratório">
<defs><radialGradient id="green"><stop stop-color="#0a7048"/><stop offset="1" stop-color="#004e32"/></radialGradient><linearGradient id="gold"><stop stop-color="#b5810e"/><stop offset=".45" stop-color="#ffe29a"/><stop offset="1" stop-color="#cf9b16"/></linearGradient></defs>
<circle r="300" fill="url(#gold)"/><circle r="292" fill="#fffef7" stroke="#005535" stroke-width="3"/>
<g id="outer"></g>
<g id="rotor" tabindex="0" role="slider" aria-label="Girar disco interno; use as setas do teclado" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0">
<circle class="focus-ring" r="222" fill="url(#green)" stroke="#d6a51e" stroke-width="3"/>
<g id="inner"></g><circle r="147" fill="none" stroke="#e2b32b" stroke-width="2"/>
</g>
<g pointer-events="none"><circle r="143" fill="#fffef7" stroke="url(#gold)" stroke-width="4"/>
<text text-anchor="middle" fill="#005535" font-family="Arial,sans-serif" font-weight="700"><tspan x="0" y="-23" font-size="28">CIFRA</tspan><tspan x="0" y="10" font-size="28">DE CÉSAR</tspan></text>
<text id="shift" x="0" y="47" text-anchor="middle" fill="#977014" font-size="17" font-family="Arial,sans-serif" font-weight="700">N = 0</text><circle cy="86" r="5" fill="#004e32"/></g>
</svg></div>
<div class="controls">
<button id="ccw" type="button" aria-label="Girar uma posição no sentido anti-horário"><span class="arrow" aria-hidden="true">↶</span>Anti-horário</button>
<button id="reset-wheel" type="button" aria-label="Reiniciar o disco e voltar à posição inicial"><span class="reset-icon" aria-hidden="true">⟲</span>Reiniciar</button>
<button id="cw" type="button" aria-label="Girar uma posição no sentido horário">Horário<span class="arrow" aria-hidden="true">↷</span></button>
</div>
<p class="note">O disco externo permanece fixo. Cada clique gira uma letra.</p>
<div id="status" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
</main>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg',alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ',step=360/26;
const wheel=document.getElementById('wheel'),rotor=document.getElementById('rotor');
function node(tag,attrs,text){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text)n.textContent=text;return n}
for(let i=0;i<26;i++){
 const angle=i*step,rad=(angle-90)*Math.PI/180,bound=(angle-step/2-90)*Math.PI/180;
 for(const [id,r1,r2,rt,color,size] of [['outer',224,290,259,'#005535',23],['inner',148,220,185,'#fffef7',22]]){
 const g=document.getElementById(id);g.append(node('line',{x1:r1*Math.cos(bound),y1:r1*Math.sin(bound),x2:r2*Math.cos(bound),y2:r2*Math.sin(bound),stroke:id==='inner'?'#dbb13c':'#005535','stroke-width':1.3}));
 g.append(node('text',{x:rt*Math.cos(rad),y:rt*Math.sin(rad),'text-anchor':'middle','dominant-baseline':'central',transform:`rotate(${angle} ${rt*Math.cos(rad)} ${rt*Math.sin(rad)})`,fill:color,'font-family':'Arial,sans-serif','font-weight':700,'font-size':size},alphabet[i]));
 }
}
let rotation=0,drag=null,targetRotation=0,animationFrame=null;
const mod=n=>((n%26)+26)%26;
const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
function draw(announce=false){
 rotor.setAttribute('transform',`rotate(${rotation})`);
 const shift=mod(-Math.round(rotation/step));
 document.getElementById('shift').textContent=`N = ${shift}`;
 rotor.setAttribute('aria-valuenow',shift);
 rotor.setAttribute('aria-valuetext',`Deslocamento ${shift}. A corresponde a ${alphabet[shift]}.`);
 if(announce)document.getElementById('status').textContent=`Deslocamento ${shift}. A corresponde a ${alphabet[shift]}.`;
}
function stopAnimation(){
 if(animationFrame!==null)cancelAnimationFrame(animationFrame);
 animationFrame=null;
 targetRotation=rotation;
}
/* Anima a rotação real do SVG; o disco não salta instantaneamente.
   Um clique durante outra animação soma a nova posição ao destino anterior. */
function animateTo(target,duration=350,normalizeAtEnd=false){
 if(animationFrame!==null)cancelAnimationFrame(animationFrame);
 animationFrame=null;
 const start=rotation,delta=target-start;
 targetRotation=target;
 if(reducedMotion.matches||Math.abs(delta)<0.0001){
  rotation=normalizeAtEnd?0:target;
  targetRotation=rotation;
  draw(true);
  return;
 }
 const startTime=performance.now();
 function frame(now){
  const t=Math.max(0,Math.min(1,(now-startTime)/duration));
  const eased=t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  rotation=start+delta*eased;
  draw();
  if(t<1){animationFrame=requestAnimationFrame(frame)}
  else{
   animationFrame=null;
   /* 360° e 0° têm a mesma aparência; normalizar evita acumular voltas. */
   rotation=normalizeAtEnd?0:target;
   targetRotation=rotation;
   draw(true);
  }
 }
 animationFrame=requestAnimationFrame(frame);
}
function turn(dir){
 if(drag)return;
 const next=Math.round(targetRotation/step)*step+dir*step;
 animateTo(next,Math.min(660,350+Math.abs(next-rotation)*1.2));
}
function resetWheel(){
 if(drag)return;
 /* Volta ao alinhamento inicial pelo caminho angular mais curto. */
 const closestZero=Math.round(rotation/360)*360;
 animateTo(closestZero,Math.min(640,340+Math.abs(closestZero-rotation)*1.5),true);
}
document.getElementById('cw').addEventListener('click',()=>turn(1));
document.getElementById('ccw').addEventListener('click',()=>turn(-1));
document.getElementById('reset-wheel').addEventListener('click',resetWheel);
function angle(e){const p=wheel.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(wheel.getScreenCTM().inverse());return {angle:Math.atan2(q.y,q.x)*180/Math.PI,r:Math.hypot(q.x,q.y)}}
rotor.addEventListener('pointerdown',e=>{
 if(drag||e.button!==0)return;
 const p=angle(e);if(p.r<35)return;
 stopAnimation();
 drag={id:e.pointerId,last:p.angle};
 rotor.setPointerCapture(e.pointerId);
 rotor.focus({preventScroll:true});e.preventDefault();
});
rotor.addEventListener('pointermove',e=>{
 if(!drag||drag.id!==e.pointerId)return;
 const p=angle(e);if(p.r<35)return;
 let delta=p.angle-drag.last;delta=((delta+540)%360)-180;
 rotation+=delta;targetRotation=rotation;
 drag.last=p.angle;draw();
});
function finish(e){
 if(!drag||drag.id!==e.pointerId)return;
 drag=null;
 const snapped=Math.round(rotation/step)*step;
 if(rotor.hasPointerCapture(e.pointerId))rotor.releasePointerCapture(e.pointerId);
 animateTo(snapped,210);
}
rotor.addEventListener('pointerup',finish);
rotor.addEventListener('pointercancel',finish);
rotor.addEventListener('lostpointercapture',finish);
rotor.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();turn(1)}
 else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();turn(-1)}
 else if(e.key==='Home'){e.preventDefault();resetWheel()}
});
draw();
</script></body></html>
