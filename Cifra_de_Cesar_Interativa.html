<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cifra de César · Disco interativo</title>
<style>
:root{color-scheme:light;--green:#005535;--gold:#d6a51e}*{box-sizing:border-box}body{margin:0;background:#f8fbf8;color:var(--green);font-family:Arial,Helvetica,sans-serif;min-height:100svh;overflow-x:hidden}body:before{content:"";position:fixed;inset:0 0 auto;height:11px;background:linear-gradient(100deg,#00492f 0%,#087044 57%,#d2a21e 57%,#ffe69a 100%)}main{width:min(100%,760px);margin:auto;padding:30px 20px 24px;text-align:center}h1{font-size:clamp(25px,4vw,36px);letter-spacing:-1px;margin:0 0 8px}p{font-size:15px;line-height:1.5;margin:0;color:#496a59}.wheel{width:min(100%,65svh,590px);margin:14px auto 12px;filter:drop-shadow(0 12px 20px #003e2514)}svg{width:100%;height:auto;display:block;overflow:visible;user-select:none;-webkit-user-select:none}#rotor{touch-action:none;cursor:grab;outline:none}#rotor:active{cursor:grabbing}#rotor:focus-visible .focus-ring{stroke:#087cc1;stroke-width:5}.controls{display:flex;justify-content:center;gap:12px}button{font:600 14px Arial;border:1px solid #c6d8cb;background:white;color:var(--green);border-radius:14px;padding:12px 18px;min-height:60px;display:flex;align-items:center;gap:10px;cursor:pointer;box-shadow:0 3px 0 #e4ece5;touch-action:manipulation}button:hover{background:#edf5ed;border-color:#86ae91}button:active{transform:translateY(2px);box-shadow:none}button:focus-visible{outline:3px solid #d6a51e;outline-offset:4px}.arrow{font-size:33px;line-height:1}.note{margin-top:17px;font-size:12px;color:#708478}@media(max-width:420px){main{padding:26px 12px 20px}.controls{gap:8px}button{padding:10px 12px;font-size:12px}.wheel{margin:22px auto}.note{font-size:11px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
</head>
<body><main>
<h1>Cifra de César</h1>
<p>Arraste o círculo verde ou use as setas para girar.</p>
<div class="wheel">
<svg id="wheel" viewBox="-310 -310 620 620" aria-label="Disco da cifra de César: alfabeto externo fixo e alfabeto interno giratório">
<defs><radialGradient id="green"><stop stop-color="#0a7048"/><stop offset="1" stop-color="#004e32"/></radialGradient><linearGradient id="gold"><stop stop-color="#b5810e"/><stop offset=".45" stop-color="#ffe29a"/><stop offset="1" stop-color="#cf9b16"/></linearGradient></defs>
<circle r="300" fill="url(#gold)"/><circle r="292" fill="#fffef7" stroke="#005535" stroke-width="3"/>
<g id="outer"></g>
<g id="rotor" tabindex="0" role="slider" aria-label="Girar disco interno; use as setas do teclado" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0">
<circle class="focus-ring" r="222" fill="url(#green)" stroke="#d6a51e" stroke-width="3"/>
<g id="inner"></g><circle r="147" fill="none" stroke="#e2b32b" stroke-width="2"/>
</g>
<g pointer-events="none"><circle r="143" fill="#fffef7" stroke="url(#gold)" stroke-width="4"/>
<text text-anchor="middle" fill="#005535" font-family="Arial,sans-serif" font-weight="700"><tspan x="0" y="-23" font-size="28">CIFRA</tspan><tspan x="0" y="10" font-size="28">DE CÉSAR</tspan></text>
<text id="shift" x="0" y="47" text-anchor="middle" fill="#977014" font-size="17" font-family="Arial,sans-serif" font-weight="700">N = 0</text><circle cy="86" r="5" fill="#004e32"/></g>
</svg></div>
<div class="controls"><button id="ccw" type="button" aria-label="Girar uma posição no sentido anti-horário"><span class="arrow" aria-hidden="true">↶</span>Anti-horário</button><button id="cw" type="button" aria-label="Girar uma posição no sentido horário">Horário<span class="arrow" aria-hidden="true">↷</span></button></div>
<p class="note">O disco externo permanece fixo. Cada clique gira uma letra.</p>
<div id="status" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
</main>
<script>
'use strict';
const NS='http://www.w3.org/2000/svg',alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ',step=360/26;
const wheel=document.getElementById('wheel'),rotor=document.getElementById('rotor');
function node(tag,attrs,text){const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(text)n.textContent=text;return n}
for(let i=0;i<26;i++){
 const angle=i*step,rad=(angle-90)*Math.PI/180,bound=(angle-step/2-90)*Math.PI/180;
 for(const [id,r1,r2,rt,color,size] of [['outer',224,290,259,'#005535',23],['inner',148,220,185,'#fffef7',22]]){
 const g=document.getElementById(id);g.append(node('line',{x1:r1*Math.cos(bound),y1:r1*Math.sin(bound),x2:r2*Math.cos(bound),y2:r2*Math.sin(bound),stroke:id==='inner'?'#dbb13c':'#005535','stroke-width':1.3}));
 g.append(node('text',{x:rt*Math.cos(rad),y:rt*Math.sin(rad),'text-anchor':'middle','dominant-baseline':'central',transform:`rotate(${angle} ${rt*Math.cos(rad)} ${rt*Math.sin(rad)})`,fill:color,'font-family':'Arial,sans-serif','font-weight':700,'font-size':size},alphabet[i]));
 }
}
let rotation=0,drag=null;
const mod=n=>((n%26)+26)%26;
function draw(announce=false){rotor.setAttribute('transform',`rotate(${rotation})`);const shift=mod(-Math.round(rotation/step));document.getElementById('shift').textContent=`N = ${shift}`;rotor.setAttribute('aria-valuenow',shift);rotor.setAttribute('aria-valuetext',`Deslocamento ${shift}. A corresponde a ${alphabet[shift]}.`);if(announce)document.getElementById('status').textContent=`Deslocamento ${shift}. A corresponde a ${alphabet[shift]}.`}
function turn(dir){if(drag)return;rotation=(Math.round(rotation/step)+dir)*step;draw(true)}
document.getElementById('cw').addEventListener('click',()=>turn(1));document.getElementById('ccw').addEventListener('click',()=>turn(-1));
function angle(e){const p=wheel.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(wheel.getScreenCTM().inverse());return {angle:Math.atan2(q.y,q.x)*180/Math.PI,r:Math.hypot(q.x,q.y)}}
rotor.addEventListener('pointerdown',e=>{if(drag||e.button!==0)return;const p=angle(e);if(p.r<35)return;drag={id:e.pointerId,last:p.angle};rotor.setPointerCapture(e.pointerId);rotor.focus({preventScroll:true});e.preventDefault()});
rotor.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const p=angle(e);if(p.r<35)return;let delta=p.angle-drag.last;delta=((delta+540)%360)-180;rotation+=delta;drag.last=p.angle;draw()});
function finish(e){if(!drag||drag.id!==e.pointerId)return;drag=null;rotation=Math.round(rotation/step)*step;draw(true);if(rotor.hasPointerCapture(e.pointerId))rotor.releasePointerCapture(e.pointerId)}
rotor.addEventListener('pointerup',finish);rotor.addEventListener('pointercancel',finish);rotor.addEventListener('lostpointercapture',finish);
rotor.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();turn(1)}else if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();turn(-1)}else if(e.key==='Home'){e.preventDefault();rotation=0;draw(true)}});draw();
</script></body></html>
